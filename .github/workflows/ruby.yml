name: ruby

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: "spec + CLI (Ruby ${{ matrix.ruby }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install --jobs 4 --retry 3
      - run: bundle exec rspec --format documentation
      - run: bundle exec ruby -r secryst -e 'puts Secryst::VERSION'
