name: python

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  train:
    name: "train (Python, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # windows-latest
        python: ['3.6', '3.7', '3.8', '3.9']
        experimental: [false]

    steps:
      - uses: actions/checkout@v2

      - name: Setup python
        uses: actions/setup-python@v1
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Install ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        #
        # wget unzips to ./libtorch
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libfftw3-dev libgsl-dev libopenblas-dev \
            liblapack-dev liblapacke-dev unzip automake make gcc g++
          wget https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-1.9.0%2Bcpu.zip
          unzip libtorch-cxx11-abi-shared-with-deps-1.9.0%2Bcpu.zip

      - name: Install macos dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install libtorch gsl lapack openblas fftw automake gcc

      - uses: actions/cache@v2
        with:
          path: ${{ env.pythonLocation }}
          # key: ${{ env.pythonLocation }}-${{ hashFiles('python/setup.py') }}-${{ hashFiles('python/requirements.txt') }}
          key: ${{ env.pythonLocation }}-${{ hashFiles('python/requirements.txt') }}

      - name: Install python dependencies
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Install requirements
      #   run: |
      #     pip install --upgrade --upgrade-strategy eager -r requirements.txt -e .

      - name: Test Python train
        run: |
          echo "Running 'python3 python/train.py'"
          python3 python/train.py \
            -i 'examples/khm-latn-small/input.csv' \
            -t 'examples/khm-latn-small/target.csv' \
            --batch-size=32 --max-epochs=500 --log-interval=1 \
            --checkpoint-every=50 --checkpoint-dir=examples/checkpoints-py \
            --gamma=0.9999
