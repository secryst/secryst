# secryst_thai_ipa_minimal — Thai SOTA minimal (no class weights, no focal).
#
# Full SOTA stack gave PER 5.12% (worse than baseline 2.18%).
# Root cause: class weights + focal loss push model to over-predict rare
# classes, hurting majority accuracy.
#
# This config strips class imbalance techniques, keeps only:
#   - AdaMuon + NorMuon (optimizer improvements)
#   - EMA decay=0.999 (Polyak averaging)
#   - Early stopping patience=5
#
# Tests if optimizer-side improvements alone beat baseline.

name: secryst_thai_ipa_minimal
description: Thai → IPA minimal SOTA (no class weights, no focal).
kind: secryst
tier: 1

data:
  cleaner: thai
  root: /datasets/thai-ipa

model:
  arch: modern_seq2seq
  dim: 256
  enc_layers: 6
  dec_layers: 6
  heads: 8
  ff_dim: 1024
  dropout: 0.1
  max_len: 128
  batch_size: 64
  memory_dropout: 0.1
  use_mhc_cross: false

train:
  epochs: 30
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  scheduler: cosine
  qk_clip_every: 50
  qk_clip_tau_init: 4.0
  qk_clip_tau_final: 1.0
  cross_attn_lr_mult: 3.0
  scheduled_sampling_final: 0.3
  scheduled_sampling_decay: linear
  # ---- Minimal SOTA: optimizer + EMA only ----
  adamuon_beta: 0.99
  normuon_enabled: true
  ema_decay: 0.999
  early_stopping_patience: 5
  # ---- Disabled (hurt Thai SOTA) ----
  class_weights: false
  focal_gamma: 0.0

eval:
  v0.1.0_max_per: 0.08
  v0.5.0_max_per: 0.05
  v1.0.0_max_per: 0.03
