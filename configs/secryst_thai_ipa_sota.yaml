# secryst_thai_ipa_sota — Thai → IPA G2P SOTA stack.
#
# Built on secryst_thai_ipa (v0.5.0) + adds 2026 SOTA techniques:
#   - Class-weighted CE (decoder vocab imbalance — IPA tokens are skewed).
#   - Focal loss (gamma=1.5 — lighter than Hebrew's 2.0 since IPA has fewer classes).
#   - EMA decay=0.999 (Polyak averaging for smoother predictions).
#   - Early stopping patience=5 (Thai-IPA trains 30 epochs, more leeway).
#   - AdaMuon + NorMuon (best optimizer stack).
#   - Entropy regularization (prevents overconfident collapse).
#
# Compare against:
#   - secryst_thai_ipa (baseline v0.5.0): PER=2.18%
#   - secryst_thai_ipa_resformer: PER=5.04% (worse — mode collapse)
#
# Goal: PER ≤ 1.5% (v1.0.0 target).

name: secryst_thai_ipa_sota
description: Thai → IPA G2P SOTA (class weights + EMA + AdaMuon + early stopping).
kind: secryst
tier: 1

data:
  cleaner: thai
  root: /datasets/thai-ipa

model:
  arch: modern_seq2seq
  dim: 256
  enc_layers: 6
  dec_layers: 6
  heads: 8
  ff_dim: 1024
  dropout: 0.1
  max_len: 128
  batch_size: 64
  memory_dropout: 0.1
  use_mhc_cross: false

train:
  epochs: 30
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  scheduler: cosine
  qk_clip_every: 50
  qk_clip_tau_init: 4.0
  qk_clip_tau_final: 1.0
  cross_attn_lr_mult: 3.0
  scheduled_sampling_final: 0.3
  scheduled_sampling_decay: linear
  # ---- SOTA: 2026 techniques ----
  class_weights: true
  focal_gamma: 1.5
  ema_decay: 0.999
  entropy_weight: 0.01
  adamuon_beta: 0.99
  normuon_enabled: true
  early_stopping_patience: 5

eval:
  v0.1.0_max_per: 0.08
  v0.5.0_max_per: 0.05
  v1.0.0_max_per: 0.03
