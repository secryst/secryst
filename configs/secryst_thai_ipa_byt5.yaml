# secryst_thai_ipa_byt5 — Thai→IPA G2P via ByT5-small fine-tuning.
#
# CTC escaped mode collapse (PER=72%) but is fundamentally limited by
# conditional independence — it can't model phonotactic constraints.
# ByT5 solves both problems:
#   1. Pretrained on mC4 (knows Thai character patterns)
#   2. Autoregressive decoder (models phonotactic constraints)
#   3. No mode collapse risk (pretrained backbone)
#
# Same approach that worked for Hebrew diacritization (ByT5-small 17% DER).
# Target: PER < 0.10 (competitive with historical SOTA ~5-6%).

name: secryst_thai_ipa_byt5
description: Thai → IPA G2P via ByT5-small fine-tuning
kind: secryst
tier: 1

data:
  cleaner: thai
  root: /datasets/thai-ipa

model:
  arch: byt5_thai
  model_name: google/byt5-small
  max_len: 256

train:
  epochs: 20
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  label_smoothing: 0.1

eval:
  v0.6.0_max_per: 0.15
  v1.0.0_max_per: 0.06
