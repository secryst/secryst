# Base config — shared defaults overridden by per-task configs.

train:
  epochs: 20
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  scheduler: cosine
  # QK-Clip disabled by default; enable per-task if needed.
  qk_clip_every: 0
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0

model:
  arch: modern_seq2seq
  dim: 256
  enc_layers: 6
  dec_layers: 6
  heads: 8
  ff_dim: 1024
  dropout: 0.1
  max_len: 128
  rope_base: 10000.0
  sk_iters: 20
