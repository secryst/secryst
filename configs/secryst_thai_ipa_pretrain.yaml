# secryst_thai_ipa_pretrain — MLM pretraining for the Thai encoder.
#
# Same dim/depth as secryst_thai_ipa's encoder. Pretrain on undiacritized
# Thai text scraped from Wiktionary headwords + Wikipedia. The encoder
# learns Thai orthography + syllable structure before supervised G2P.
#
# Output is loaded into secryst_thai_ipa's encoder via init_from_pretrain.

name: secryst_thai_ipa_pretrain
description: Thai char-level MLM pretraining (secryst, K3/DS4 modern stack).
kind: secryst_mlm

data:
  cleaner: thai
  root: /datasets/thai-text
  mask_prob: 0.15
  max_len: 128

model:
  arch: modern_seq2seq  # ignored for pretrain; build_pretrain_model handles it
  dim: 256
  layers: 6
  heads: 8
  ff_dim: 1024
  dropout: 0.1
  max_len: 128
  batch_size: 64

train:
  epochs: 6
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  fp16: true
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  scheduler: cosine

eval:
  v0.1.0_max_val_loss: 2.5
